services:
  mongodb:
    image: mongo:7
    container_name: leaveease-mongodb
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: lms_admin
      MONGO_INITDB_ROOT_PASSWORD: lms_password
      MONGO_INITDB_DATABASE: leave_management_system
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "-u", "lms_admin", "-p", "lms_password", "--authenticationDatabase", "admin", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  mailpit:
    image: axllent/mailpit:latest
    container_name: leaveease-mailpit
    restart: unless-stopped
    ports:
      - "11025:1025"
      - "18025:8025"

  backend:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: leaveease-backend
    restart: unless-stopped
    depends_on:
      mongodb:
        condition: service_healthy
      mailpit:
        condition: service_started
    environment:
      PORT: 5000
      MONGO_URI: mongodb://lms_admin:lms_password@mongodb:27017/leave_management_system?authSource=admin
      JWT_SECRET: leaveease_mcsp232_docker_jwt_secret_key_2026
      JWT_EXPIRES_IN: 1d
      CORS_ORIGIN: http://localhost:3000,http://localhost:5173
      SMTP_HOST: mailpit
      SMTP_PORT: 1025
      SMTP_SECURE: "false"
      SMTP_FROM: lms@leaveease.local
    ports:
      - "5000:5000"

  frontend:
    build:
      context: ./client
      dockerfile: Dockerfile
      args:
        VITE_API_URL: /api
    container_name: leaveease-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "3000:80"

volumes:
  mongo_data:
